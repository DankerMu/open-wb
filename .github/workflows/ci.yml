name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .tool-versions, cache: npm }
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
      - run: cd kbservice && uv sync
      - run: npx biome check server web scripts
      - run: cd kbservice && uv run ruff check . && uv run ruff format --check .
      - run: npm run typecheck --workspaces

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .tool-versions, cache: npm }
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
      - run: cd kbservice && uv sync
      - run: npm test --workspaces
      - run: cd kbservice && uv run pytest

  anti-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .tool-versions, cache: npm }
      - run: npm ci
      - run: npx knip
      - run: npx jscpd --config .jscpd.json
      - run: bash scripts/naming-guard.sh $(git ls-files 'server/**' 'web/**' 'kbservice/**' 'scripts/**')
      - run: bash scripts/size-guard.sh

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/default --error server web kbservice scripts

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .tool-versions, cache: npm }
      - run: npm ci
      - run: npm run build --workspace web
      - run: npm run build --workspace server
      - name: install hurl 8.0.1
        env:
          HURL_URL: https://github.com/Orange-OpenSource/hurl/releases/download/8.0.1/hurl-8.0.1-x86_64-unknown-linux-gnu.tar.gz
          HURL_SHA256: cac7c4670d69444db120edb21fe06c97ba8c80dcc52279957c8dd18f05fb0c06
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/hurl-8.0.1"
          mkdir -p "$tool_dir"
          archive="${tool_dir}/hurl-8.0.1-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --retry 3 --retry-delay 2 --retry-max-time 60 \
            --connect-timeout 15 --max-time 120 --output "$archive" "$HURL_URL"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          if [ "$actual" != "$HURL_SHA256" ]; then
            echo "Hurl archive digest mismatch: expected ${HURL_SHA256}, got ${actual}" >&2
            exit 1
          fi
          tar -xzf "$archive" -C "$tool_dir"
          bin_dir="${tool_dir}/hurl-8.0.1-x86_64-unknown-linux-gnu/bin"
          test -x "${bin_dir}/hurl"
          echo "$bin_dir" >> "$GITHUB_PATH"
          export PATH="${bin_dir}:${PATH}"
          command -v hurl
          hurl --version
      - name: smoke compiled server
        env:
          HOST: "127.0.0.1"
          PORT: "18016"
          SMOKE_BASE_URL: "http://127.0.0.1:18016"
          DB_PATH: "${{ runner.temp }}/workbuddy-smoke/app.db"
          STATIC_ROOT: "${{ github.workspace }}/smoke/fixtures/static"
        run: |
          set -euo pipefail
          command -v hurl
          hurl --version
          state="${RUNNER_TEMP}/workbuddy-smoke"
          mkdir -p "$state"
          log="${state}/server.log"
          origin="http://${HOST}:${PORT}"
          pid=""
          primary_rc=0
          cleanup_rc=0
          sanitize() {
            sed -E -e 's/[0-9a-fA-F]{64}/[redacted]/g' -e 's/"password":"[^"]*"/"password":"[redacted]"/g'
          }
          dump_logs() {
            echo "----- server log (failure) -----" >&2
            if [ -f "$log" ]; then
              sanitize < "$log" | tail -n 80 >&2
            fi
          }
          pid_alive() { [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; }
          reap() {
            if [ -z "$pid" ]; then
              return
            fi
            if pid_alive; then
              kill -TERM "$pid" 2>/dev/null || true
              n=0
              while [ "$n" -lt 20 ] && pid_alive; do
                sleep 0.25
                n=$((n + 1))
              done
              if pid_alive; then
                kill -KILL "$pid" 2>/dev/null || true
                n=0
                while [ "$n" -lt 8 ] && pid_alive; do
                  sleep 0.25
                  n=$((n + 1))
                done
              fi
            fi
            if pid_alive; then
              echo "cleanup failed: PID ${pid} still present" >&2
              cleanup_rc=1
              pid=""
              return
            fi
            wait "$pid" 2>/dev/null || true
            pid=""
          }
          on_exit() {
            local ec=$?
            trap - EXIT TERM INT
            reap
            if [ "$primary_rc" -eq 0 ] && [ "$ec" -ne 0 ]; then
              primary_rc=$ec
            fi
            if [ "$primary_rc" -ne 0 ]; then
              exit "$primary_rc"
            fi
            exit "$cleanup_rc"
          }
          trap on_exit EXIT
          trap 'exit 143' TERM INT
          node server/dist/server.js >"$log" 2>&1 &
          pid=$!
          sleep 0.1
          if ! pid_alive; then
            dead_pid=$pid
            wait "$pid" 2>/dev/null || true
            pid=""
            echo "server exited early (pid ${dead_pid})" >&2
            dump_logs
            primary_rc=1
            exit 1
          fi
          ready=0
          attempts=0
          while [ "$attempts" -lt 40 ]; do
            if ! pid_alive; then
              echo "server exited before readiness (pid ${pid})" >&2
              break
            fi
            if curl -fsS --connect-timeout 1 --max-time 2 \
              "${origin}/api/healthz" >/dev/null 2>&1; then
              ready=1
              break
            fi
            attempts=$((attempts + 1))
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            echo "readiness failed against /api/healthz (pid ${pid})" >&2
            dump_logs
            primary_rc=1
            exit 1
          fi
          set +e
          make smoke 2>&1 | sanitize
          pipe_rc=("${PIPESTATUS[@]}")
          set -e
          if [ "${pipe_rc[0]}" -ne 0 ]; then
            primary_rc=${pipe_rc[0]}
          elif [ "${pipe_rc[1]}" -ne 0 ]; then
            primary_rc=${pipe_rc[1]}
          else
            primary_rc=0
          fi
          if [ "$primary_rc" -ne 0 ]; then
            dump_logs
            exit "$primary_rc"
          fi
  ui-walk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .tool-versions, cache: npm }
      - run: npm ci
      - run: npm run build --workspace web
      - run: npm run build --workspace server
      - run: npx playwright install --with-deps chromium
      - name: ui-walk compiled server
        env:
          HOST: "127.0.0.1"
          PORT: "18017"
          UI_WALK_BASE_URL: "http://127.0.0.1:18017"
          DB_PATH: "${{ runner.temp }}/workbuddy-ui-walk/app.db"
          STATIC_ROOT: "${{ github.workspace }}/web/dist"
        run: |
          set -euo pipefail
          state="${RUNNER_TEMP}/workbuddy-ui-walk"
          mkdir -p "$state"
          log="${state}/server.log"
          origin="http://${HOST}:${PORT}"
          pid=""
          primary_rc=0
          cleanup_rc=0
          sanitize() {
            sed -E -e 's/[0-9a-fA-F]{64}/[redacted]/g' -e 's/"password":"[^"]*"/"password":"[redacted]"/g'
          }
          dump_logs() {
            echo "----- server log (failure) -----" >&2
            if [ -f "$log" ]; then
              sanitize < "$log" | tail -n 80 >&2
            fi
          }
          pid_alive() { [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; }
          reap() {
            if [ -z "$pid" ]; then
              return
            fi
            if pid_alive; then
              kill -TERM "$pid" 2>/dev/null || true
              n=0
              while [ "$n" -lt 20 ] && pid_alive; do
                sleep 0.25
                n=$((n + 1))
              done
              if pid_alive; then
                kill -KILL "$pid" 2>/dev/null || true
                n=0
                while [ "$n" -lt 8 ] && pid_alive; do
                  sleep 0.25
                  n=$((n + 1))
                done
              fi
            fi
            if pid_alive; then
              echo "cleanup failed: PID ${pid} still present" >&2
              cleanup_rc=1
              pid=""
              return
            fi
            wait "$pid" 2>/dev/null || true
            pid=""
          }
          on_exit() {
            local ec=$?
            trap - EXIT TERM INT
            reap
            if [ "$primary_rc" -eq 0 ] && [ "$ec" -ne 0 ]; then
              primary_rc=$ec
            fi
            if [ "$primary_rc" -ne 0 ]; then
              exit "$primary_rc"
            fi
            exit "$cleanup_rc"
          }
          trap on_exit EXIT
          trap 'exit 143' TERM INT
          node server/dist/server.js >"$log" 2>&1 &
          pid=$!
          sleep 0.1
          if ! pid_alive; then
            dead_pid=$pid
            wait "$pid" 2>/dev/null || true
            pid=""
            echo "server exited early (pid ${dead_pid})" >&2
            dump_logs
            primary_rc=1
            exit 1
          fi
          ready=0
          attempts=0
          while [ "$attempts" -lt 40 ]; do
            if ! pid_alive; then
              echo "server exited before readiness (pid ${pid})" >&2
              break
            fi
            if curl -fsS --connect-timeout 1 --max-time 2 \
              "${origin}/api/healthz" >/dev/null 2>&1; then
              ready=1
              break
            fi
            attempts=$((attempts + 1))
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            echo "readiness failed against /api/healthz (pid ${pid})" >&2
            dump_logs
            primary_rc=1
            exit 1
          fi
          set +e
          make ui-walk 2>&1 | sanitize
          pipe_rc=("${PIPESTATUS[@]}")
          set -e
          if [ "${pipe_rc[0]}" -ne 0 ]; then
            primary_rc=${pipe_rc[0]}
          elif [ "${pipe_rc[1]}" -ne 0 ]; then
            primary_rc=${pipe_rc[1]}
          else
            primary_rc=0
          fi
          if [ "$primary_rc" -ne 0 ]; then
            dump_logs
            exit "$primary_rc"
          fi

  all-checks-passed:
    # 聚合门禁：分支保护只指向本 job。skipped 视为失败——GitHub 把 skipped 的
    # required check 当通过，这个洞必须在这里堵死。
    if: always()
    needs: [fast-checks, unit-tests, anti-drift, secret-scan, sast, smoke, ui-walk]
    runs-on: ubuntu-latest
    steps:
      - name: verify all required jobs succeeded
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          if echo "$results" | grep -Eq '"result": *"(failure|cancelled|skipped)"'; then
            echo "some required job did not succeed (failure/cancelled/skipped)"; exit 1
          fi
