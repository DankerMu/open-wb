name: ci
on:
  push:
    branches: [master]
  pull_request:

# 同一 PR 的新推送取消旧运行。master 永不取消，每个合入提交都有完整结果：同组里排队等待的运行
# 会被更新的到达者取消（与 cancel-in-progress 无关），所以 master 按提交 sha 各占一组，不排队也不互相取消。
concurrency:
  group: ci-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .tool-versions, cache: npm }
      - run: npm ci
      - run: npx biome check server web scripts converter vitest.shared.mjs
      - run: npm run typecheck --workspaces
      - run: npx openspec validate --all --strict --no-interactive

  # 单元测试按文件分片（change ci-unit-test-sharding）：分片内只跑测试并写 vitest blob，
  # 覆盖率阈值在 unit-coverage 合并全部分片后才执行。分片数来自逐文件耗时模拟，改动前先重新测量。
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # 一片失败不取消其余分片，每片的失败日志都完整保留。
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .tool-versions, cache: npm }
      - run: npm ci
      - run: npm run test:shard --workspace server -- --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-server-${{ matrix.shard }}
          path: server/.vitest-reports/
          # .vitest-reports 是点目录，upload-artifact 默认跳过隐藏文件；不打开就会报「没有文件」。
          include-hidden-files: true
          # 默认 warn：blob 没写出来时分片仍算成功，合并 job 才发现缺片；在源头就失败。
          if-no-files-found: error
          # blob 只供同一次运行的 unit-coverage 使用，默认 90 天白占存储配额。
          retention-days: 1
          # 「重跑全部 job」时上一轮的同名 artifact 还在，不覆盖会 409；名字按 workspace 与分片唯一，只会覆盖同一片自己的旧 blob。
          overwrite: true

  unit-tests-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # 同 unit-tests：一片失败不取消其余分片。
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .tool-versions, cache: npm }
      - run: npm ci
      - run: npm run test:shard --workspace web -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-web-${{ matrix.shard }}
          path: web/.vitest-reports/
          # 同 unit-tests：点目录要显式打开隐藏文件。
          include-hidden-files: true
          # 同 unit-tests：没有 blob 即在源头失败。
          if-no-files-found: error
          # 同 unit-tests：只供本次运行合并。
          retention-days: 1
          # 同 unit-tests：重跑时覆盖同一片自己的旧 blob。
          overwrite: true

  # 合并两个 workspace 的全部分片并执行覆盖率门禁；ci-unit-merge.sh 先确认分片 1..N 一个不缺。
  unit-coverage:
    needs: [unit-tests, unit-tests-web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .tool-versions, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-server-*
          path: server/.vitest-reports
          # 默认每个 artifact 落进自己的子目录；ci-unit-merge.sh 要求 blob 平铺在同一目录。
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-web-*
          path: web/.vitest-reports
          # 同上：平铺进同一目录。
          merge-multiple: true
      - run: bash .github/scripts/ci-unit-merge.sh server
      - run: bash .github/scripts/ci-unit-merge.sh web

  anti-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .tool-versions, cache: npm }
      - run: npm ci
      - run: npx knip
      - run: npx jscpd --config .jscpd.json
      - run: bash scripts/naming-guard.sh $(git ls-files 'server/**' 'web/**' 'scripts/**')
      - run: bash scripts/size-guard.sh

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5
      - run: semgrep scan --config p/default --error server web scripts

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .tool-versions, cache: npm }
      - run: npm ci
      - run: npm run build --workspace web
      - run: npm run build --workspace server
      - name: install hurl 8.0.1
        run: bash .github/scripts/ci-install-hurl.sh
      - uses: actions/cache@v6
        with:
          path: var/omp/omp
          key: omp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/omp-fetch.sh') }}
      - run: make omp-fetch
      - name: smoke compiled server
        env:
          HOST: "127.0.0.1"
          PORT: "18016"
          SMOKE_BASE_URL: "http://127.0.0.1:18016"
          DB_PATH: "${{ runner.temp }}/workbuddy-smoke/app.db"
          STATIC_ROOT: "${{ github.workspace }}/smoke/fixtures/static"
          OMP_BIN: "${{ github.workspace }}/var/omp/omp"
          OMP_STATE_DIR: "${{ runner.temp }}/workbuddy-smoke/omp-state"
          SANDBOX_ROOT: "${{ runner.temp }}/workbuddy-smoke/sandbox"
          MODEL_UPSTREAM_BASE_URL: "http://127.0.0.1:19016/v1"
          MODEL_UPSTREAM_API_KEY: "fake"
          FAKE_UPSTREAM_PORT: "19016"
        run: bash .github/scripts/ci-compiled-server.sh smoke

  ui-walk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .tool-versions, cache: npm }
      - run: npm ci
      - run: npm run build --workspace web
      - run: npm run build --workspace server
      - run: npx playwright install --with-deps chromium
      - uses: actions/cache@v6
        with:
          path: var/omp/omp
          key: omp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/omp-fetch.sh') }}
      - run: make omp-fetch
      - name: ui-walk compiled server
        env:
          HOST: "127.0.0.1"
          PORT: "18017"
          UI_WALK_BASE_URL: "http://127.0.0.1:18017"
          DB_PATH: "${{ runner.temp }}/workbuddy-ui-walk/app.db"
          STATIC_ROOT: "${{ github.workspace }}/web/dist"
          OMP_BIN: "${{ github.workspace }}/var/omp/omp"
          OMP_STATE_DIR: "${{ runner.temp }}/workbuddy-ui-walk/omp-state"
          SANDBOX_ROOT: "${{ runner.temp }}/workbuddy-ui-walk/sandbox"
          MODEL_UPSTREAM_BASE_URL: "http://127.0.0.1:19017/v1"
          MODEL_UPSTREAM_API_KEY: "fake"
          FAKE_UPSTREAM_PORT: "19017"
        run: bash .github/scripts/ci-compiled-server.sh ui-walk

  uid-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .tool-versions, cache: npm }
      - run: npm ci
      - run: npm run build --workspace web
      - run: npm run build --workspace server
      - uses: actions/cache@v6
        with:
          path: var/omp/omp
          key: omp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/omp-fetch.sh') }}
      - run: make omp-fetch
      - run: bash .github/scripts/ci-install-hurl.sh
      - name: uid-isolation
        env:
          HOST: "127.0.0.1"
          PORT: "18018"
          SMOKE_BASE_URL: "http://127.0.0.1:18018"
          DB_PATH: "${{ runner.temp }}/workbuddy-uid-isolation/private/app.db"
          STATIC_ROOT: "${{ github.workspace }}/smoke/fixtures/static"
          OMP_BIN: "${{ github.workspace }}/var/omp/omp"
          OMP_STATE_DIR: "${{ runner.temp }}/workbuddy-uid-isolation/omp-state"
          SANDBOX_ROOT: "${{ runner.temp }}/workbuddy-uid-isolation/sandbox"
          MODEL_UPSTREAM_BASE_URL: "http://127.0.0.1:19018/v1"
          MODEL_UPSTREAM_API_KEY: "fake"
          FAKE_UPSTREAM_PORT: "19018"
        run: bash .github/scripts/ci-uid-isolation.sh

  office-sidecar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .tool-versions, cache: npm }
      - run: npm ci
      - run: npm run build --workspace server
      - run: docker build -t workbuddy-converter:ci converter/
      - run: bash .github/scripts/ci-office-sidecar.sh

  browser-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .tool-versions, cache: npm }
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: var/omp/omp
          key: omp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/omp-fetch.sh') }}
      - run: make omp-fetch
      - run: docker build --build-context omp-seed=var/omp -t workbuddy-app:ci -f deploy/app/Dockerfile .
      - run: bash .github/scripts/ci-browser-image.sh

  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .tool-versions, cache: npm }
      - run: npm ci
      - run: make test-guardrails

  all-checks-passed:
    # 聚合门禁：分支保护只指向本 job。skipped 视为失败——GitHub 把 skipped 的
    # required check 当通过，这个洞必须在这里堵死。
    if: always()
    needs: [fast-checks, unit-tests, unit-tests-web, unit-coverage, anti-drift, guardrails, secret-scan, sast, smoke, ui-walk, uid-isolation, office-sidecar, browser-image]
    runs-on: ubuntu-latest
    steps:
      - name: verify all required jobs succeeded
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          if echo "$results" | grep -Eq '"result": *"(failure|cancelled|skipped)"'; then
            echo "some required job did not succeed (failure/cancelled/skipped)"; exit 1
          fi
