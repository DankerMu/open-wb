<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QueueScope jobs</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--qs-bg);
        color: var(--qs-fg);
        font: 13px/1.45 var(--qs-font-ui);
      }
      button,
      select {
        font: inherit;
      }
      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: var(--qs-sidebar) 1fr;
        grid-template-rows: var(--qs-topbar) 1fr;
      }
      .sidebar {
        grid-row: 1/3;
        background: var(--qs-fg);
        color: white;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 18px;
      }
      .mark {
        font-weight: 800;
      }
      .topbar {
        grid-column: 2;
        border-bottom: 1px solid var(--qs-border);
        background: var(--qs-surface);
        display: flex;
        align-items: center;
        padding: 0 18px;
        font-weight: 650;
      }
      .main {
        grid-column: 2;
        padding: 18px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 14px 0;
      }
      .control {
        height: var(--qs-control);
        border: 1px solid var(--qs-border);
        border-radius: var(--qs-radius);
        background: var(--qs-surface);
        padding: 0 10px;
        color: var(--qs-fg);
      }
      .table {
        border: 1px solid var(--qs-border);
        background: var(--qs-surface);
      }
      .row {
        display: grid;
        grid-template-columns: 1.4fr 0.8fr 0.8fr 0.8fr;
        border-bottom: 1px solid var(--qs-border);
        min-height: 40px;
        align-items: center;
        padding: 0 12px;
      }
      .row:last-child {
        border-bottom: 0;
      }
      .head {
        background: var(--qs-surface-muted);
        color: var(--qs-muted);
        font-size: 12px;
        font-weight: 650;
      }
      .mono {
        font-family: var(--qs-font-mono);
      }
      .status {
        font-weight: 650;
      }
      .failed {
        color: var(--qs-danger);
      }
      .running {
        color: var(--qs-info);
      }
      .queued {
        color: var(--qs-muted);
      }
    </style>
  </head>
  <body>
    <div class="app" data-od-id="queuescope-shell">
      <aside class="sidebar" data-od-id="queuescope-sidebar"><span class="mark">QS</span></aside>
      <header class="topbar" data-od-id="queuescope-topbar">QueueScope / Jobs</header>
      <main class="main" data-od-id="jobs-main">
        <h1>Batch jobs</h1>
        <div class="toolbar" data-od-id="jobs-filters">
          <select class="control" aria-label="Job status">
            <option>All statuses</option>
            <option>Failed</option>
            <option>Running</option>
          </select>
          <button class="control" type="button">Refresh</button>
        </div>
        <section class="table" aria-label="Jobs" data-od-id="jobs-table">
          <div class="row head">
            <span>Job</span><span>Status</span><span>Duration</span><span>Owner</span>
          </div>
          <button class="row control" type="button" data-job="import-ledger">
            <span class="mono">job-7f3a / import-ledger</span
            ><span class="status failed">Failed</span><span class="mono">08:42</span
            ><span>Data Ops</span>
          </button>
          <button class="row control" type="button" data-job="sync-registry">
            <span class="mono">job-1b92 / sync-registry</span
            ><span class="status running">Running</span><span class="mono">03:18</span
            ><span>Platform</span>
          </button>
          <button class="row control" type="button" data-job="archive-events">
            <span class="mono">job-95c1 / archive-events</span
            ><span class="status queued">Queued</span><span class="mono">—</span
            ><span>Storage</span>
          </button>
        </section>
      </main>
    </div>
  </body>
</html>
