# Machine-readable readiness registry for eng-init audit/repair.
# Canonical executable contract for criteria metadata; keep in sync with
# references/agent-readiness-criteria.md using scripts/check_readiness_registry.py.
schema_version: 1
scoring:
  repo_scope_denominator: 1
  app_scope_denominator: APPLICATIONS_IDENTIFIED
  configured_but_not_blocking_credit: 0.5
  null_numerator_allowed_only_when_skippable: true
control_plane_layers:
  - Memory
  - Invariant
  - Protocol
  - Permission
  - Sensorium
  - Evaluation / GC
  - Governance
criteria:
