    level: 3
    scope: repository
    skippable: false
    fixability: B
    layer: Protocol
    artifact: Conventions / Enforcement
    validator: Hook/CI/LFS/lint flags files over threshold
    rescore_evidence: large_file_detection=1/1 when evidence satisfies the criterion; 0/1 when missing; null only if skippable and not applicable
